# Performance Baseline Configuration
# All values in milliseconds

# Page Load Performance Thresholds
page.load.timeout.ms=5000
page.load.baseline.ms=3000

# Element Interaction Performance Thresholds
element.interaction.timeout.ms=2000
element.click.baseline.ms=500
element.sendkeys.baseline.ms=800

# API Response Performance Thresholds
api.response.timeout.ms=3000
api.response.baseline.ms=1500
api.slow.threshold.ms=2500

# Slow Test Configuration
slow.test.threshold.ms=10000
alert.threshold.percentile=90

# Video Recording Configuration
enable.video.recording.on.failure=true
video.recording.format=mp4
video.recording.framerate=30

# Metrics Collection
enable.metrics=true
metrics.export.format=json
metrics.export.path=target/metrics
