# Production Environment Configuration
browser=chrome
headless=true
baseUrl=https://www.google.com

# Production Timeouts (longer for stability)
implicitWait=0
explicitWait=30
pageLoadTimeout=60

# Production Paths
screenshotPath=target/screenshots-prod
reportPath=target/reports-prod

# Production Test Data (from environment variables only - NO HARDCODED!)
testuser.username=${PROD_USERNAME}
testuser.password=${PROD_PASSWORD}
orangeHRM.username=${ORANGEHRM_PROD_USERNAME}
orangeHRM.password=${ORANGEHRM_PROD_PASSWORD}
orangeHRM.baseUrl=https://prod.orangehrm.com/

# Production Metrics
enableMetrics=true
enableVideoRecording=true
slowTestThresholdMs=3000

# Logging
logLevel=WARN
