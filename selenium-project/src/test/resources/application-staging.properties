# Staging Environment Configuration
browser=chrome
headless=true
baseUrl=https://www.google.com

# Staging Timeouts
implicitWait=0
explicitWait=25
pageLoadTimeout=45

# Staging Paths
screenshotPath=target/screenshots-staging
reportPath=target/reports-staging

# Staging Test Data
testuser.username=admin_staging
testuser.password=staging_password_${STAGING_PASSWORD}
orangeHRM.username=Admin
orangeHRM.password=${ORANGEHRM_PASSWORD}
orangeHRM.baseUrl=https://staging-demo.orangehrm.com/

# Staging Metrics  
enableMetrics=true
enableVideoRecording=true
slowTestThresholdMs=4000

# Logging
logLevel=INFO
